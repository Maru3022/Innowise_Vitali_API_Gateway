spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-public
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/logout

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**

grpc:
  client:
    auth-service:
      address: 'static://${GRPC_AUTH_HOST:127.0.0.1}:${GRPC_AUTH_PORT:9090}'
      negotiationType: plaintext

logging:
  level:
    com.example.innowise_vitali: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:DEBUG}